name: Build FramePilot

on:
  workflow_dispatch:
  push:
  pull_request:

concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download YOLO models
        run: |
          python -c "from ultralytics import YOLO; YOLO('yolov8m.pt'); YOLO('yolov8m-seg.pt')"
          dir *.pt

      - name: Run tests
        run: pytest tests/ -v

      - name: Build with PyInstaller
        run: pyinstaller framepilot.spec --noconfirm --clean

      - name: Add Lightroom Classic plugin
        run: Copy-Item -Recurse lightroom\FramePilot.lrplugin dist\FramePilot\

      - name: Verify build
        run: |
          dir dist\FramePilot\FramePilot.exe
          dir dist\FramePilot\framepilot-engine.exe
          dir dist\FramePilot\FramePilot.lrplugin\Info.lua
          echo "Build size:"
          (Get-Item dist\FramePilot\FramePilot.exe).Length

      - name: Smoke test engine
        shell: pwsh
        run: |
          $image = python -c "import os, ultralytics; print(os.path.join(os.path.dirname(ultralytics.__file__), 'assets', 'bus.jpg'))"
          $job = @{ settings = @{ aspect_ratio = "4:5" }; photos = @(@{ id = "1"; path = $image }) } | ConvertTo-Json -Depth 5
          Set-Content -Path engine-job.json -Value $job
          & dist\FramePilot\framepilot-engine.exe engine-job.json engine-result.tsv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content engine-result.tsv
          if (-not (Select-String -Path engine-result.tsv -Pattern "`tsuccess`t" -Quiet)) { exit 1 }

      - name: Create ZIP archive
        run: Compress-Archive -Path dist\FramePilot\* -DestinationPath dist\FramePilot.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FramePilot-Windows
          path: dist/FramePilot.zip
          retention-days: 30

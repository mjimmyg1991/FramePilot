name: Build FramePilot

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install pyinstaller

      - name: Download YOLO models
        run: |
          python -c "from ultralytics import YOLO; YOLO('yolov8m.pt'); YOLO('yolov8m-seg.pt')"
          dir *.pt

      - name: Run tests
        run: pytest tests/ -v

      - name: Build with PyInstaller
        run: pyinstaller framepilot.spec --noconfirm --clean

      - name: Verify build
        run: |
          dir dist\FramePilot\FramePilot.exe
          echo "Build size:"
          (Get-Item dist\FramePilot\FramePilot.exe).Length

      - name: Create ZIP archive
        run: Compress-Archive -Path dist\FramePilot\* -DestinationPath dist\FramePilot-Windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FramePilot-Windows
          path: dist/FramePilot-Windows.zip
          retention-days: 30

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install pyinstaller

      - name: Download YOLO models
        run: |
          python -c "from ultralytics import YOLO; YOLO('yolov8m.pt'); YOLO('yolov8m-seg.pt')"
          ls -lh *.pt

      - name: Generate macOS icon
        run: |
          mkdir -p framepilot.iconset
          sips -z 16 16     "branding/FramePilot Icon Mark.png" --out framepilot.iconset/icon_16x16.png
          sips -z 32 32     "branding/FramePilot Icon Mark.png" --out framepilot.iconset/icon_16x16@2x.png
          sips -z 32 32     "branding/FramePilot Icon Mark.png" --out framepilot.iconset/icon_32x32.png
          sips -z 64 64     "branding/FramePilot Icon Mark.png" --out framepilot.iconset/icon_32x32@2x.png
          sips -z 128 128   "branding/FramePilot Icon Mark.png" --out framepilot.iconset/icon_128x128.png
          sips -z 256 256   "branding/FramePilot Icon Mark.png" --out framepilot.iconset/icon_128x128@2x.png
          sips -z 256 256   "branding/FramePilot Icon Mark.png" --out framepilot.iconset/icon_256x256.png
          sips -z 512 512   "branding/FramePilot Icon Mark.png" --out framepilot.iconset/icon_256x256@2x.png
          sips -z 512 512   "branding/FramePilot Icon Mark.png" --out framepilot.iconset/icon_512x512.png
          sips -z 1024 1024 "branding/FramePilot Icon Mark.png" --out framepilot.iconset/icon_512x512@2x.png
          iconutil -c icns framepilot.iconset -o branding/framepilot.icns

      - name: Run tests
        run: pytest tests/ -v

      - name: Build with PyInstaller
        run: pyinstaller framepilot.spec --noconfirm --clean

      - name: Verify build
        run: |
          ls -lh dist/FramePilot.app
          file dist/FramePilot.app/Contents/MacOS/FramePilot

      - name: Create DMG
        run: |
          brew install create-dmg
          create-dmg \
            --volname "FramePilot" \
            --volicon "branding/framepilot.icns" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "FramePilot.app" 150 185 \
            --app-drop-link 450 185 \
            --hide-extension "FramePilot.app" \
            "dist/FramePilot-macOS.dmg" \
            "dist/FramePilot.app"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FramePilot-macOS
          path: dist/FramePilot-macOS.dmg
          retention-days: 30

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/FramePilot-Windows/FramePilot-Windows.zip
            artifacts/FramePilot-macOS/FramePilot-macOS.dmg
